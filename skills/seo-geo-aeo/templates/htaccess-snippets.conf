# Apache / LiteSpeed rules used with this skill (static site + PHP endpoints). Adapt paths.

Options -Indexes -MultiViews
DirectorySlash Off
DirectoryIndex index.html
RewriteEngine On

# Never serve dotfiles, except /.well-known/.
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule (^|/)\. - [F,L]

# Remote MCP server for AI assistants: /mcp and its Server Card /mcp/server-card -> the PHP script
# (before the generic rules; the script serves the card from its data folder).
RewriteRule ^mcp(/server-card)?$ /a/mcp.php [L]

# Canonical URLs without trailing slash (never for "//host/", which would redirect off-site).
RewriteCond %{REQUEST_URI} !^//
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^(.+)/$ /$1 [R=301,L]

# /page -> page.html, /it -> it.html, /it/blog/x -> it/blog/x.html
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{DOCUMENT_ROOT}/$1.html -f
RewriteRule ^(.+)$ /$1.html [L]

ErrorDocument 404 /404.html

<IfModule mod_mime.c>
  AddType application/wasm .wasm
  AddType text/javascript .mjs
  # agents.md, the guide for AI agents.
  AddType "text/markdown; charset=utf-8" .md
</IfModule>

<IfModule mod_headers.c>
  # Pages, sitemap, feeds, llms.txt, agents.md: always revalidate.
  <FilesMatch "\.(html|xml|txt|md)$">
    Header set Cache-Control "public, max-age=0, must-revalidate"
  </FilesMatch>
  <FilesMatch "\.(js|mjs|css|woff2|wasm|webp|png|svg|ico)$">
    Header set Cache-Control "public, max-age=604800"
  </FilesMatch>
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
  # Full policy in report-only mode until every page has been checked.
  Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
</IfModule>
